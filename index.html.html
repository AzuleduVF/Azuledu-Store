<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azuledu Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#221C2C;
    --paper:#F3ECDF;
    --paper-2:#E7DCEA;
    --purple:#5B3E7D;
    --purple-deep:#3A2856;
    --gold:#C9A227;
    --glow:#B98CE0;
    --line: rgba(34,28,44,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, rgba(185,140,224,0.16), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Bungee', sans-serif;
    letter-spacing:.01em;
  }
  header.top{
    padding:34px 20px 24px;
    border-bottom:2px solid var(--purple);
    position:relative;
    background:linear-gradient(180deg, rgba(58,40,86,0.10), transparent 75%);
    text-align:center;
  }
  .logo-wrap{
    width:112px; height:112px;
    margin:0 auto 14px;
    border-radius:50%;
    padding:4px;
    background:var(--gold);
    box-shadow:0 0 0 3px var(--purple-deep), 0 0 26px rgba(185,140,224,0.55);
  }
  .logo-wrap img{
    width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;
  }
  .eyebrow{
    font-size:11.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--purple);
    font-weight:700;
    margin:0 0 6px;
  }
  .shopname{
    font-size:clamp(24px,6.5vw,36px);
    font-weight:400;
    margin:0;
    line-height:1.1;
    cursor:default;
    color:var(--purple-deep);
    text-shadow:1px 1px 0 var(--gold);
  }
  .tagline{
    margin:12px auto 0;
    font-size:14.5px;
    color:rgba(34,28,44,0.72);
    max-width:480px;
  }
  .admin-toggle{
    position:absolute;
    top:26px; right:20px;
    background:var(--paper);
    border:1.5px solid var(--purple);
    border-radius:999px;
    padding:7px 14px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    color:var(--purple);
  }
  .admin-toggle:hover{ background:var(--purple); color:#fff; }

  .filters{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    padding:16px 20px; border-bottom:1px solid var(--line);
  }
  .chip{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:12.5px; font-weight:700;
    padding:6px 14px;
    border:1.3px solid var(--purple);
    border-radius:999px;
    background:#fff;
    cursor:pointer;
    color:var(--purple);
  }
  .chip.active{ background:var(--gold); border-color:var(--gold); color:var(--ink); }

  main{ padding:22px 16px 60px; max-width:1080px; margin:0 auto; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
  }
  .card{
    background:#fff;
    border:1.5px solid var(--paper-2);
    border-radius:14px;
    padding:14px;
    position:relative;
    display:flex;
    flex-direction:column;
    gap:8px;
    box-shadow:0 2px 0 var(--paper-2);
  }
  .tag{
    position:absolute;
    top:-11px; left:14px;
    background:var(--gold);
    color:var(--ink);
    font-size:11px;
    font-weight:700;
    padding:3px 11px;
    border-radius:999px;
    border:1px solid #fff;
    box-shadow:0 1px 3px rgba(34,28,44,0.3);
    letter-spacing:.02em;
  }
  .card img{
    width:100%; height:150px; object-fit:cover;
    border-radius:10px; border:1px solid var(--paper-2);
    background:#fff;
  }
  .card .noimg{
    width:100%; height:150px; border-radius:10px;
    border:1.3px dashed var(--purple);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:rgba(91,62,125,0.8);
  }
  .card h3{
    font-size:16.5px; margin:2px 0 0; line-height:1.25;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:700;
  }
  .card .desc{
    font-size:13px; color:rgba(34,28,44,0.7);
    line-height:1.45; flex-grow:1;
  }
  .price-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:2px;
  }
  .price{
    font-family:'Bungee',sans-serif;
    font-size:17px;
    color:var(--purple);
  }
  .buy-btn{
    background:var(--purple); color:#fff;
    border:none; border-radius:999px;
    padding:9px 14px; font-size:12.5px; font-weight:700;
    font-family:'Zen Kaku Gothic New',sans-serif;
    cursor:pointer;
  }
  .buy-btn:hover{ filter:brightness(1.1); }
  .card-admin-row{
    display:flex; gap:8px; margin-top:2px;
  }
  .mini-btn{
    flex:1; font-size:11.5px; font-weight:700;
    border-radius:8px; padding:6px; cursor:pointer;
    border:1.3px solid var(--purple); background:#fff; color:var(--purple);
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .mini-btn.danger{ color:#A23B57; border-color:#A23B57; }

  .empty{
    text-align:center; padding:70px 20px; color:rgba(34,28,44,0.55);
  }
  .empty .display{ font-size:20px; color:var(--ink); margin-bottom:6px; }

  .overlay{
    position:fixed; inset:0; background:rgba(34,28,44,0.5);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  @media(min-width:640px){ .overlay{ align-items:center; } }
  .modal{
    background:var(--paper); border:2px solid var(--purple);
    border-radius:16px 16px 0 0; padding:22px 20px 26px;
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  }
  @media(min-width:640px){ .modal{ border-radius:16px; } }
  .modal h2{ margin:0 0 14px; font-size:19px; color:var(--purple-deep); }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:12px; font-weight:700;
    color:var(--purple); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;
  }
  .field input, .field textarea{
    width:100%; padding:9px 10px; border:1.3px solid var(--paper-2);
    border-radius:9px; font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:14px; background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .field select{
    width:100%; padding:9px 10px; border:1.3px solid var(--paper-2);
    border-radius:9px; font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:14px; background:#fff; color:var(--ink);
  }
  .hint{ font-size:12px; color:rgba(34,28,44,0.55); margin-top:6px; }
  .cat-row{
    display:flex; align-items:center; gap:10px; justify-content:space-between;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .cat-row:last-child{ border-bottom:none; }
  .cat-name{ font-weight:700; font-size:14px; }
  .cat-add-row{ display:flex; gap:8px; margin-top:14px; }
  .cat-add-row input{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-primary{
    flex:1; background:var(--purple-deep); color:#fff;
    border:none; border-radius:999px; padding:11px; font-weight:700;
    font-size:14px; cursor:pointer; font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .btn-secondary{
    background:transparent; border:1.3px solid var(--purple); color:var(--purple);
    border-radius:999px; padding:11px 16px; font-weight:700; font-size:14px;
    cursor:pointer; font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .fab{
    position:fixed; bottom:22px; right:20px;
    background:var(--gold); color:var(--ink); border:none;
    width:54px; height:54px; border-radius:50%;
    font-size:26px; cursor:pointer; box-shadow:0 4px 10px rgba(34,28,44,0.35);
    z-index:30;
  }
</style>
</head>

  <p class="eyebrow" id="eyebrow">Tienda personal</p>
  <h1 class="shopname" id="shopname">Azuledu Store</h1>
  <p class="tagline" id="tagline">Cosas lindas y curadas para vos. Escribime y coordinamos.</p>
  <button class="admin-toggle" id="adminToggle" style="display:none;">Editar tienda</button>
  <button class="admin-toggle" id="catToggle" style="display:none; right:auto; left:20px;" onclick="openCategoriesModal()">Categorías</button>
</header>

<div class="filters" id="filters"></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none">
    <p class="display">Tu tienda está vacía</p>
    <p>Tocá "Editar tienda" y agregá tu primer producto.</p>
  </div>
</main>

<button class="fab" id="fab" style="display:none" title="Agregar producto">+</button>

<div id="modalRoot"></div>

<script>
let isAdmin = false;
let isOwnerLink = false;
let meta = { name: "Azuledu Store", tagline: "Cosas lindas y curadas para vos. Escribime y coordinamos.", whatsapp: "", currency: "$" };
let products = [];
let categoryList = [];
let activeCategory = "Todos";
let pin = null;

async function safeGet(key){
  try{ const r = await window.storage.get(key, true); return r ? r.value : null; }
  catch(e){ return null; }
}
async function safeSet(key, value){
  try{ await window.storage.set(key, value, true); }catch(e){ console.error(e); }
}

async function loadAll(){
  const params = new URLSearchParams(window.location.search);
  isOwnerLink = params.get('duenio') === 'si';
  if(isOwnerLink){ document.getElementById('adminToggle').style.display = 'inline-block'; }
  const m = await safeGet('shop:meta');
  if(m){ meta = JSON.parse(m); }
  const p = await safeGet('shop:products');
  if(p){ products = JSON.parse(p); }
  const c = await safeGet('shop:categories');
  if(c){ categoryList = JSON.parse(c); }
  else { categoryList = ["Tecnología", "Maquillaje", "Ropa"]; safeSet('shop:categories', JSON.stringify(categoryList)); }
  const pn = await safeGet('shop:pin');
  if(pn){ pin = pn; }
  renderHeader();
  render();
}

function renderHeader(){
  document.getElementById('shopname').textContent = meta.name;
  document.getElementById('tagline').textContent = meta.tagline;
}

function categories(){
  return ["Todos", ...categoryList];
}

function saveCategoryList(){
  safeSet('shop:categories', JSON.stringify(categoryList));
}

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = "";
  categories().forEach(cat=>{
    const b = document.createElement('button');
    b.className = 'chip' + (cat===activeCategory ? ' active':'');
    b.textContent = cat;
    b.onclick = ()=>{ activeCategory = cat; render(); };
    el.appendChild(b);
  });
}

function waLink(product){
  const number = (product.whatsapp || meta.whatsapp || "").replace(/[^0-9]/g,'');
  const msg = encodeURIComponent(`Hola! Te escribo por "${product.name}" que vi en ${meta.name}.`);
  if(!number) return null;
  return `https://wa.me/${number}?text=${msg}`;
}

function render(){
  renderFilters();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = "";
  const list = products.filter(p => activeCategory==="Todos" || p.category===activeCategory);
  empty.style.display = products.length===0 ? 'block' : 'none';
  document.getElementById('fab').style.display = isAdmin ? 'flex' : 'none';
  document.getElementById('catToggle').style.display = isAdmin ? 'inline-block' : 'none';

  list.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';
    const link = waLink(p);
    card.innerHTML = `
      ${p.category ? `<span class="tag">${escapeHtml(p.category)}</span>` : ''}
      ${p.image ? `<img src="${escapeAttr(p.image)}" alt="${escapeAttr(p.name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'Sin imagen'}))">` : `<div class="noimg">Sin imagen</div>`}
      <h3>${escapeHtml(p.name)}</h3>
      <div class="desc">${escapeHtml(p.desc||'')}</div>
      <div class="price-row">
        <span class="price">${meta.currency}${p.price}</span>
        ${link ? `<button class="buy-btn" onclick="window.open('${link}','_blank')">Consultar</button>` : `<span style="font-size:11px;color:#A23B57">Falta WhatsApp</span>`}
      </div>
      ${isAdmin ? `<div class="card-admin-row">
        <button class="mini-btn" onclick="openProductModal('${p.id}')">Editar</button>
        <button class="mini-btn danger" onclick="deleteProduct('${p.id}')">Borrar</button>
      </div>` : ''}
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function deleteProduct(id){
  if(!confirm('¿Borrar este producto?')) return;
  products = products.filter(p=>p.id!==id);
  safeSet('shop:products', JSON.stringify(products));
  render();
}

function openProductModal(id){
  const existing = id ? products.find(p=>p.id===id) : null;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="overlay" id="ov">
    <div class="modal">
      <h2>${existing ? 'Editar producto' : 'Nuevo producto'}</h2>
      <div class="field"><label>Nombre</label><input id="f_name" value="${existing?escapeAttr(existing.name):''}" placeholder="Ej: Audífonos Sony WH-1000"></div>
      <div class="field">
        <label>Categoría</label>
        <select id="f_cat">
          <option value="">Sin categoría</option>
          ${categoryList.map(c => `<option value="${escapeAttr(c)}" ${existing && existing.category===c ? 'selected':''}>${escapeHtml(c)}</option>`).join('')}
        </select>
        ${categoryList.length===0 ? `<div class="hint">Todavía no creaste categorías. Cerrá esto y tocá "Categorías" para crear la primera.</div>` : ''}
      </div>
      <div class="field"><label>Precio</label><input id="f_price" value="${existing?existing.price:''}" placeholder="Ej: 45"></div>
      <div class="field"><label>Descripción</label><textarea id="f_desc" placeholder="Estado, detalles, etc.">${existing?escapeHtml(existing.desc||''):''}</textarea></div>
      <div class="field"><label>URL de imagen (opcional)</label><input id="f_img" value="${existing?escapeAttr(existing.image||''):''}" placeholder="https://..."></div>
      <div class="field"><label>WhatsApp específico (opcional)</label><input id="f_wa" value="${existing?escapeAttr(existing.whatsapp||''):''}" placeholder="Si es distinto al general de la tienda"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" onclick="saveProduct('${existing?existing.id:''}')">Guardar</button>
      </div>
    </div>
  </div>`;
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ""; }

function saveProduct(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('Poné al menos un nombre'); return; }
  const data = {
    id: id || ('p_' + Date.now()),
    name,
    category: document.getElementById('f_cat').value.trim(),
    price: document.getElementById('f_price').value.trim() || '0',
    desc: document.getElementById('f_desc').value.trim(),
    image: document.getElementById('f_img').value.trim(),
    whatsapp: document.getElementById('f_wa').value.trim(),
  };
  if(id){
    products = products.map(p => p.id===id ? data : p);
  } else {
    products.push(data);
  }
  safeSet('shop:products', JSON.stringify(products));
  closeModal();
  render();
}

function openCategoriesModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="overlay" id="ov">
    <div class="modal">
      <h2>Categorías</h2>
      <div id="catListWrap">
        ${categoryList.length===0 ? '<div class="hint">Todavía no creaste ninguna. Agregá la primera abajo.</div>' : categoryList.map(c => `
          <div class="cat-row">
            <span class="cat-name">${escapeHtml(c)}</span>
            <button class="mini-btn danger" style="flex:none; padding:6px 12px;" onclick="removeCategory('${escapeAttr(c).replace(/'/g,"\\'")}')">Borrar</button>
          </div>
        `).join('')}
      </div>
      <div class="cat-add-row">
        <input id="newCatInput" placeholder="Ej: Perfumes">
        <button class="btn-primary" style="flex:none; padding:11px 18px;" onclick="addCategory()">Agregar</button>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" style="flex:1;" onclick="closeModal()">Listo</button>
      </div>
    </div>
  </div>`;
}

function addCategory(){
  const input = document.getElementById('newCatInput');
  const name = input.value.trim();
  if(!name) return;
  if(categoryList.some(c => c.toLowerCase()===name.toLowerCase())){
    alert('Esa categoría ya existe');
    return;
  }
  categoryList.push(name);
  saveCategoryList();
  openCategoriesModal();
  render();
}

function removeCategory(name){
  const inUse = products.filter(p=>p.category===name).length;
  if(inUse > 0 && !confirm(`${inUse} producto(s) usan esta categoría y quedarán "Sin categoría". ¿Borrar de todas formas?`)) return;
  categoryList = categoryList.filter(c=>c!==name);
  products = products.map(p => p.category===name ? {...p, category:''} : p);
  saveCategoryList();
  safeSet('shop:products', JSON.stringify(products));
  openCategoriesModal();
  render();
}

function openSettingsModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="overlay" id="ov">
    <div class="modal">
      <h2>Datos de la tienda</h2>
      <div class="field"><label>Nombre de la tienda</label><input id="s_name" value="${escapeAttr(meta.name)}"></div>
      <div class="field"><label>Frase corta</label><input id="s_tag" value="${escapeAttr(meta.tagline)}"></div>
      <div class="field"><label>WhatsApp general (con código de país, sin +)</label><input id="s_wa" value="${escapeAttr(meta.whatsapp)}" placeholder="Ej: 50588887777"></div>
      <div class="field"><label>Símbolo de moneda</label><input id="s_cur" value="${escapeAttr(meta.currency)}" placeholder="$"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" onclick="saveSettings()">Guardar</button>
      </div>
    </div>
  </div>`;
}

function saveSettings(){
  meta.name = document.getElementById('s_name').value.trim() || 'Azuledu Store';
  meta.tagline = document.getElementById('s_tag').value.trim();
  meta.whatsapp = document.getElementById('s_wa').value.trim();
  meta.currency = document.getElementById('s_cur').value.trim() || '$';
  safeSet('shop:meta', JSON.stringify(meta));
  renderHeader();
  closeModal();
  render();
}

async function toggleAdmin(){
  if(isAdmin){
    isAdmin = false;
    document.getElementById('adminToggle').textContent = 'Editar tienda';
    render();
    return;
  }
  if(!pin){
    const newPin = prompt('Creá un PIN para poder editar tu tienda (guardalo, te lo va a pedir cada vez):');
    if(!newPin) return;
    pin = newPin;
    await safeSet('shop:pin', pin);
  } else {
    const entered = prompt('PIN de administración:');
    if(entered !== pin){ if(entered!==null) alert('PIN incorrecto'); return; }
  }
  isAdmin = true;
  document.getElementById('adminToggle').textContent = 'Salir de edición';
  render();
}

document.getElementById('shopname').addEventListener('click', ()=>{
  if(isAdmin) openSettingsModal();
});
document.getElementById('adminToggle').addEventListener('click', toggleAdmin);
document.getElementById('fab').addEventListener('click', ()=>openProductModal(null));

loadAll();
</script>
</body>
</html>
